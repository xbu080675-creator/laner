name: ARC010 Tournament Edition Domain Split

on:
  push:
    branches:
      - tmp/arc010
    paths:
      - '.github/workflows/arc010-tournament-edition-split.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split tournament edition domain from runtime store
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('app/src/main/java/com/riftlab/app/data/TournamentEditionArchive.kt')
          text = src.read_text(encoding='utf-8')
          model_marker = '/**\n * dev.69 turns every Riot tournament/season into a durable edition entity.'
          store_marker = '\nobject TournamentEditionArchiveStore {'
          if text.count(model_marker) != 1:
              raise SystemExit(f'{src}: expected one edition model marker')
          if text.count(store_marker) != 1:
              raise SystemExit(f'{src}: expected one TournamentEditionArchiveStore marker')

          model_start = text.index(model_marker)
          store_start = text.index(store_marker)
          if model_start >= store_start:
              raise SystemExit('edition model/store order is invalid')

          prefix = text[:model_start].rstrip()
          model_body = text[model_start:store_start].rstrip()
          store_body = text[store_start + 1:].lstrip().rstrip()
          package_line = 'package com.riftlab.app.data'
          if not prefix.startswith(package_line):
              raise SystemExit('unexpected TournamentEditionArchive package')

          core_path = Path('core/src/main/kotlin/com/riftlab/app/data/TournamentEditionModels.kt')
          if core_path.exists():
              raise SystemExit(f'{core_path}: already exists')
          core_path.write_text(package_line + '\n\n' + model_body + '\n', encoding='utf-8')
          src.write_text(prefix + '\n\n' + store_body + '\n', encoding='utf-8')

          core_text = core_path.read_text(encoding='utf-8')
          forbidden = ('import android.', 'import androidx.', 'kotlinx.coroutines', 'okhttp3.', 'org.json.', 'java.io.File')
          for token in forbidden:
              if token in core_text:
                  raise SystemExit(f'{core_path}: forbidden dependency leaked into Core: {token}')
          required = [
              'enum class TournamentEditionSlotState',
              'data class TournamentEditionSlot',
              'data class TournamentQualificationArchive',
              'data class TournamentEditionArchiveRecord',
              'data class TournamentEditionDetail',
              'data class TournamentEditionArchiveState',
          ]
          for token in required:
              if core_text.count(token) != 1:
                  raise SystemExit(f'{core_path}: expected one {token}')
          if 'object TournamentEditionArchiveStore' in core_text:
              raise SystemExit('runtime store leaked into Core')
          if src.read_text(encoding='utf-8').count('object TournamentEditionArchiveStore') != 1:
              raise SystemExit('app runtime store missing after split')

          schema_src = Path('app/src/main/java/com/riftlab/app/data/TournamentResearchSchema.kt')
          schema_core = Path('core/src/main/kotlin/com/riftlab/app/data/TournamentResearchSchema.kt')
          if schema_core.exists():
              raise SystemExit(f'{schema_core}: already exists')
          schema_text = schema_src.read_text(encoding='utf-8')
          if schema_text.count('object TournamentResearchSchema') != 1:
              raise SystemExit(f'{schema_src}: unexpected schema declaration')
          schema_core.write_text(schema_text, encoding='utf-8')
          schema_src.unlink()

          readme = Path('core/README.md')
          readme_text = readme.read_text(encoding='utf-8')
          anchor = '- `Qualification*` 资格领域模型、LPL/Worlds/LCP 官方资格静态快照与规则。\n'
          addition = '- `TournamentEdition*` 年度赛事档案领域模型与 `TournamentResearchSchema` 稳定 schema 标记。\n'
          if readme_text.count(anchor) != 1:
              raise SystemExit('core README qualification anchor missing')
          if addition not in readme_text:
              readme_text = readme_text.replace(anchor, anchor + addition, 1)
          readme.write_text(readme_text, encoding='utf-8')

          record = Path('docs/development/2026/2026-09-13_LNR-ARC-010_tournament-edition-domain-split.md')
          if record.exists():
              raise SystemExit(f'{record}: already exists')
          record.write_text(
              '# LNR-ARC-010 / Tournament Edition 档案模型与 Store 物理拆分\n\n'
              '- 日期：2026-09-13\n'
              '- 执行者：OpenAI / ChatGPT\n'
              '- 状态：PASS\n\n'
              '## 目标\n\n'
              '把年度赛事档案的纯领域模型与 Android/文件/JSON/协程运行时 Store 分离；不改变归档、补全、持久化、选择届次、UI 或 Provider 行为。\n\n'
              '## 迁移\n\n'
              '- 新增 `core/src/main/kotlin/com/riftlab/app/data/TournamentEditionModels.kt`，承载 `TournamentEditionSlotState`、`TournamentEditionSlot`、`TournamentQualificationArchive`、`TournamentEditionArchiveRecord`、`TournamentEditionDetail`、`TournamentEditionArchiveState`。\n'
              '- `TournamentEditionArchiveStore` 及其 `Context`、`File`、`org.json`、协程、历史 Standings/Event 补全继续留在 App/Adapter 侧。\n'
              '- `TournamentResearchSchema.kt` 原样迁入 Core。\n\n'
              '## 行为影响\n\n'
              '无功能变化。Core 只描述 Tournament Edition/Archive 的领域状态；App 继续负责持久化、网络补全和运行时编排。\n\n'
              '## 验收\n\n'
              '- `tools/check_core_boundary.py` PASS。\n'
              '- `tools/check_repository_links.py` PASS。\n'
              '- `:core:test` PASS。\n'
              '- `:app:assembleDebug` PASS。\n',
              encoding='utf-8'
          )
          PY

          git diff --check
          test -e core/src/main/kotlin/com/riftlab/app/data/TournamentEditionModels.kt
          test -e core/src/main/kotlin/com/riftlab/app/data/TournamentResearchSchema.kt
          test ! -e app/src/main/java/com/riftlab/app/data/TournamentResearchSchema.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Enforce architecture gates
        run: |
          python3 tools/check_core_boundary.py
          python3 tools/check_repository_links.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify full build
        run: gradle :core:test :app:assembleDebug --stacktrace --no-daemon

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'PocketSpace'
          git config user.email 'xbu080675@gmail.com'
          rm -f .github/workflows/arc010-tournament-edition-split.yml
          git add -A
          git diff --cached --quiet && { echo 'No ARC010 changes to commit'; exit 1; }
          git commit -m 'LNR-ARC-010: split tournament edition domain from runtime store'
          git push origin HEAD:tmp/arc010
