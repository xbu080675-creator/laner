name: Esports8 Live Probe

on:
  push:
    branches:
      - research/esports8-live-probe-2026-09-13
    paths:
      - '.github/workflows/esports8-live-probe.yml'
      - 'tools/esports8_live_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: https://m.esports8.com/lol/match/l70s9sjtm011ytx
      MATCH_ID: l70s9sjtm011ytx
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Probe public match page and browser network
        run: |
          mkdir -p probe-output
          python tools/esports8_live_probe.py "$TARGET_URL" "$MATCH_ID" probe-output | tee probe-output/summary.log

      - name: Show candidate endpoints
        if: always()
        run: |
          echo '===== summary ====='
          cat probe-output/summary.log 2>/dev/null || true
          echo '===== candidate endpoints ====='
          cat probe-output/candidate_endpoints.txt 2>/dev/null || true
          echo '===== websocket urls ====='
          cat probe-output/websockets.txt 2>/dev/null || true

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esports8-live-probe-l70s9sjtm011ytx
          path: probe-output/
          retention-days: 7
