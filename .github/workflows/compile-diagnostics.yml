name: Compile Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compile-diagnostics.yml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'core/**'
      - 'app/build.gradle.kts'
      - 'app/src/main/java/**/*.kt'
      - 'scripts/**'
      - 'tools/check_core_boundary.py'
      - 'tools/check_repository_links.py'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Enforce Core boundary
        run: python3 tools/check_core_boundary.py
      - name: Enforce Laner repository links
        run: python3 tools/check_repository_links.py
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and capture log
        shell: bash
        run: |
          set +e
          gradle :core:test :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee compile.log
          code=${PIPESTATUS[0]}
          echo "$code" > compile.exit
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-diagnostics
          path: |
            compile.log
            compile.exit
      - name: Fail when compile failed
        if: always()
        shell: bash
        run: |
          test -f compile.exit
          test "$(cat compile.exit)" = "0"
