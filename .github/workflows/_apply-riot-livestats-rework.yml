## Scope
Improve the existing global Riot LiveStats adapter without adding a duplicate provider or changing UI/Core contracts.

## Evidence
The public live-lol-esports project demonstrates use of Riot `feed.lolesports.com/livestats/v1/window/{gameId}` with a `startingTime` cursor aligned to a 10-second grid and a look-back delay. Laner already uses the same official endpoint, but generated discovery/read cursors from arbitrary wall-clock seconds and reset the event/game binding after a temporary empty window.

The reference project is GPL-3.0. Laner does not copy its source code; this is an independent implementation of the observed protocol behavior.

## Changes
- Added an App/Adapter `RiotLiveStatsCursor`.
- Align all startingTime candidates to the 10-second frame grid.
- Begin at 60 seconds look-back, tighten after stable success, and back off after repeated misses.
- Use the same aligned cursor ladder for discovery and normal reads.
- Empty current windows become WAITING_FOR_MATCH and keep the resolved EventDetails/gameId binding.
- Existing no-cursor compatibility fallback remains last.
- Core, MatchIdentityPolicy, router priorities, and UI remain unchanged.

## Validation
- `python3 tools/check_core_boundary.py`
- `python3 tools/check_repository_links.py`
- `gradle :app:compileDebugKotlin`
- `gradle :app:assembleDebug`
''')

