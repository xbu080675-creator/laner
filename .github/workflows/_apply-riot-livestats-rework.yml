## Scope

Improve the existing global Riot LiveStats adapter without adding a second Riot provider and without changing UI/Core contracts.

## Evidence

A public live-lol-esports implementation demonstrates that Riot `feed.lolesports.com/livestats/v1/window/{gameId}` is consumed with a `startingTime` cursor aligned to a 10-second grid and a look-back delay. Laner already used the same official endpoint, but its discovery/read cursors were generated from arbitrary wall-clock seconds (15/30/60/...) and a temporary empty window reset the entire event/game binding.

The external reference is GPL-3.0. Laner does **not** copy its source code. This change is an independent implementation of the observed protocol behavior.

## Changes

- Added `RiotLiveStatsCursor` in the App/Adapter layer.
- Align every `startingTime` candidate to Riot's 10-second frame grid.
- Start with a 60-second look-back, tighten after stable successful reads, and back off after repeated misses.
- Reuse the same aligned cursor ladder for game discovery and normal reads.
- Treat an empty/currently unavailable window as `WAITING_FOR_MATCH`; keep the resolved EventDetails/gameId binding instead of resetting it.
- Keep the existing no-cursor request as the last compatibility fallback.
- Core remains unchanged; `MatchIdentityPolicy` and the global provider router remain the acceptance gates.

## Boundaries

Network access remains in App/Adapter code. No Android/platform API was introduced into Core. No UI behavior or provider priority was changed.

## Validation

- `python3 tools/check_core_boundary.py`
- `python3 tools/check_repository_links.py`
- `gradle :app:compileDebugKotlin`
- `gradle :app:assembleDebug`

The workflow that applied this patch runs these gates before committing the implementation.
''')

