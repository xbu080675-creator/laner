## Task
- ID: RIOT-LIVE-G3-HANDOFF
- Executor: OpenAI / ChatGPT
- Baseline: `main@9d97dacb7a838df8afdbef87fe8ec13cdbb73a92`

## User-visible failure
During AL vs BLG, Riot public Event `117155436343202202` had Game 3 in progress while Laner remained `BETWEEN GAMES · COMM · waiting G3`. The app had the correct series/event identity but did not hand off to the Riot G3 LiveStats game id quickly enough.

## Root cause
Laner preferred state-driven discovery and historical-window probing. Between games, EventDetails already contains all BO game ids, but the next game may still be marked `unstarted` while the previous game remains readable forever as historical LiveStats. This allowed the previous game binding to survive and made the handoff depend on probing the next game's first frame.

## Fix
- Derive the expected next game number from the authoritative current series score: `sum(gameWins) + 1`.
- Bind the corresponding Riot EventDetails game id before historical-window fallback, even if its state is still `unstarted`.
- Keep that game id through temporary empty windows; the existing aligned adaptive cursor waits for the first valid frame.
- Prefer the highest `InProgress` game if Riot state has already advanced.
- Exclude `completed`, `unneeded`, and cancelled games from historical current-game discovery so old frames cannot re-select a finished game.

## Scope / boundaries
Only the App/Adapter Riot live-source selector changes. Core, UI, provider priority, MatchIdentityPolicy, and external APIs are unchanged. No GPL source code was copied.

## Validation gates
- `python3 tools/check_core_boundary.py`
- `python3 tools/check_repository_links.py`
- `gradle :app:compileDebugKotlin`
- `gradle :app:assembleDebug`

Real-device acceptance remains required against a live between-games -> next-game transition.

## Rollback
Revert the final implementation commit produced from this branch.

## Status
Implementation workflow must pass all listed gates before merge. Real-device live transition remains external acceptance.
''')

