name: Apply Riot G3 Handoff Fix
on:
  push:
    branches:
      - fix/riot-g3-handoff
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/riot-g3-handoff
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Apply patch
        run: python3 tools/apply_riot_g3_handoff.py
      - name: Verify architecture gates
        run: |
          python3 tools/check_core_boundary.py
          python3 tools/check_repository_links.py
      - name: Compile and build
        run: |
          gradle :app:compileDebugKotlin
          gradle :app:assembleDebug
      - name: Commit implementation
        run: |
          rm -f .github/workflows/_apply-riot-g3-handoff.yml .github/workflows/_smoke-g3.yml tools/apply_riot_g3_handoff.py
          git config user.name "PocketSpace"
          git config user.email "xbu080675@gmail.com"
          git add -A
          git commit -m "fix(live): bind expected Riot game before window probe"
          git push origin HEAD:fix/riot-g3-handoff
