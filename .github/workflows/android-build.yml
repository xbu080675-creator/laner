name: Android Build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional. An unset repository secret intentionally builds an honest no-credential APK.
      # Never echo this value in workflow steps or logs.
      LOL_ESPORTS_API_KEY: ${{ secrets.LOL_ESPORTS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Architecture boundary gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^import (android|androidx|okhttp3|org\.json|retrofit2)\.' core/domain/src core/application/src; then
            echo 'Core boundary violation: platform/network import found.' >&2
            exit 1
          fi
          if grep -R -n -E 'com\.laner\.app' core/domain/src core/application/src; then
            echo 'Core boundary violation: app package referenced from Core.' >&2
            exit 1
          fi

      - name: Domain and application tests
        run: gradle :core:domain:test :core:application:test --stacktrace

      - name: Android adapter unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android debug compile
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Android test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: laner-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
